   <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DatAnalyse Botanical - Secure AI Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes wavePulse {
            0%, 100% { height: 15%; }
            50% { height: 95%; }
        }
        .animate-wave {
            animation: wavePulse 1.2s ease-in-out infinite alternate;
        }
    </style>
</head>
<body class="bg-[#0b0813] text-gray-200 font-sans min-h-screen p-4 md:p-8">

    <!-- Security Verification Overlay -->
    <div id="authOverlay" class="fixed inset-0 bg-[#0b0813] z-50 flex flex-col items-center justify-center p-4">
        <div class="bg-[#120d20] border border-purple-900/60 p-8 rounded-2xl max-w-md w-full text-center shadow-2xl">
            <h2 class="text-2xl font-bold text-purple-400 mb-2">DatAnalyse AI Studio</h2>
            <p class="text-xs text-gray-400 mb-6">200% Secure System Access</p>
            
            <button onclick="unlockDashboard()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition">
                🔓 Access Secure Dashboard
            </button>
        </div>
    </div>

    <!-- Main Dashboard Area -->
    <div id="dashboard" class="hidden">
        <header class="flex flex-wrap justify-between items-center mb-6 pb-4 border-b border-purple-900/40">
            <div class="flex items-center gap-2">
                <span class="text-purple-500 font-bold text-xl">📊 DatAnalyse Botanical</span>
            </div>
            <div class="flex items-center gap-3 mt-2 sm:mt-0">
                <span class="bg-purple-950 text-purple-300 border border-purple-800 text-xs px-3 py-1 rounded-full">🔒 Authenticated Session</span>
                <span class="bg-gray-900 text-gray-400 text-xs px-3 py-1 rounded-full">Owner: Sona Ram Das</span>
                <button onclick="logout()" class="bg-pink-600 hover:bg-pink-700 text-white px-4 py-1.5 rounded-lg text-sm font-semibold shadow-lg shadow-pink-600/30">
                    Logout
                </button>
            </div>
        </header>

        <!-- Dashboard Grid Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Left Controls Panel -->
            <div class="bg-[#120d20] border border-purple-900/40 rounded-2xl p-6 shadow-xl">
                <h2 class="text-sm font-semibold text-purple-400 mb-4 uppercase tracking-wider">⚙️ Controls & Data Model</h2>
                <div class="border-2 border-dashed border-purple-800/50 rounded-xl p-6 text-center cursor-pointer mb-6 bg-[#18112b]/50">
                    <p class="text-xs text-purple-300">Upload CSV File for Analysis</p>
                </div>
                <select class="w-full bg-[#1b1330] border border-purple-800/60 rounded-xl p-3 text-sm text-gray-200 mb-6">
                    <option>Model A: Linear Trend Analysis</option>
                </select>
                <button class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg">
                    ▶ Run Self-Healing Diagnosis
                </button>
            </div>

            <!-- Right Visuals Panel -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-[#120d20] border border-purple-900/40 rounded-2xl p-6 shadow-xl">
                    <h2 class="text-sm font-semibold text-purple-400 uppercase tracking-wider mb-6">👁 Real-time Analytics & Visuals</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
                        <div class="bg-[#171029] p-6 rounded-xl border border-purple-900/30 flex justify-center">
                            <span class="text-2xl font-bold text-white">70% GROWTH</span>
                        </div>
                        <div class="bg-[#171029] p-6 rounded-xl border border-purple-900/30 h-48 flex items-end justify-between gap-2 px-4">
                            <div class="w-3 bg-pink-500 rounded-t-sm animate-wave" style="animation-delay: 0.1s;"></div>
                            <div class="w-3 bg-pink-500 rounded-t-sm animate-wave" style="animation-delay: 0.4s;"></div>
                            <div class="w-3 bg-pink-500 rounded-t-sm animate-wave" style="animation-delay: 0.2s;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tidio Integration -->
    <script src="//code.tidio.co/q08b1h5jntzru2q6adozdletxhmwfipo.js" async></script>

    <script>
        function unlockDashboard() {
            document.getElementById('authOverlay').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
        }

        function logout() {
            location.reload();
        }
    </script>
</body>
</html>
